# ══ 스토리지·백업 ════════════════════════════════════════════

# Longhorn ★ privileged
# Q1 YES → privileged
#   분산 블록 스토리지라 노드의 블록 디바이스와 /dev, 커널 모듈에 직접 접근한다.
#   engine·manager 가 DaemonSet 으로 뜨고 privileged 를 요구한다.
apiVersion: v1
kind: Namespace
metadata:
  name: dang-longhorn-ns
  labels:
    tier: storage
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/warn-version: v1.36

---
# Velero (백업)
# ⚠️ 백업 방식에 따라 레벨이 갈린다:
#    · 볼륨 스냅샷만 사용        → controller 만 뜨므로 restricted 가능
#    · node-agent(파일 수준 백업) → /var/lib/kubelet/pods 를 hostPath 로 읽어야 해서 privileged
#    지금은 안전한 쪽(baseline)으로 두고, 백업 방식 확정 후 조정한다.
apiVersion: v1
kind: Namespace
metadata:
  name: dang-velero-ns
  labels:
    tier: storage
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36

# 네임스페이스 + PSA 라벨
#
# 라벨 형식은 공식 문서 예제를 그대로 따른다:
#   pod-security.kubernetes.io/<모드>: <레벨>
#   pod-security.kubernetes.io/<모드>-version: v1.36
#
# 설계 원칙 3가지:
#   1) 기본은 restricted. 완화는 "그 워크로드가 무엇을 요구하는가"에서 역산해서만 한다.
#   2) enforce보다 audit/warn을 한 단계 높게 둔다.
#      → "restricted로 올리면 뭐가 깨질지"가 계속 보인다. 공식 예제와 같은 패턴.
#   3) 완화가 필요한 워크로드는 네임스페이스를 쪼개서 가둔다.
#      → 관측 스택 5종 전체를 privileged로 만들지 않고, DaemonSet 2개만 분리했다.
#
# tier 라벨은 NetworkPolicy의 namespaceSelector에서 쓴다(7/29 작업).
# ⚠️ 네임스페이스는 반드시 이 라벨과 "함께" 생성해야 한다.
#    먼저 만들고 나중에 라벨을 붙이면, 그 사이에 들어온 워크로드는 검사를 안 받는다.

---
# ── 프론트엔드 ────────────────────────────────────────────────
# Q1 host 접근? NO / Q2 root 필요? NO → restricted
apiVersion: v1
kind: Namespace
metadata:
  name: dang-fe-ns
  labels:
    tier: frontend
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36

---
# ── 백엔드 ────────────────────────────────────────────────────
# Q1 NO / Q2 NO → restricted
# 도커 단계에서 이미 cap_drop·no-new-privileges를 적용해뒀으므로 요구 조건이 맞는다.
apiVersion: v1
kind: Namespace
metadata:
  name: dang-be-ns
  labels:
    tier: backend
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36

---
# ── 데이터베이스 ──────────────────────────────────────────────
# Q1 host 접근? NO / Q2 root 필요? YES → baseline
#   PostgreSQL·MongoDB 공식 이미지는 entrypoint가 root로 시작해 초기화 후 권한을 낮춘다.
#   root 시작은 restricted의 runAsNonRoot만 위반하고, baseline이 막는 항목(privileged·
#   hostPath·host 네임스페이스)에는 해당하지 않는다. 그래서 baseline이면 충분하다.
# 공식 예제와 동일한 형태: enforce는 baseline, audit/warn은 restricted로 한 단계 위.
apiVersion: v1
kind: Namespace
metadata:
  name: dang-db-ns
  labels:
    tier: database
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36

---
# ── 관측 (수집·저장·시각화) ───────────────────────────────────
# Q1 NO / Q2 NO → restricted
#   Prometheus(65534) · Grafana(472) · Loki(10001) 모두 기본이 non-root다.
#   호스트 접근이 필요한 DaemonSet 2종은 아래 별도 네임스페이스로 뺐다.
apiVersion: v1
kind: Namespace
metadata:
  name: dang-obsv-ns
  labels:
    tier: observability
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36

---
# ── 관측 에이전트 (DaemonSet 전용) ★ 유일한 privileged ───────
# Q1 host 접근? YES → privileged
#   node-exporter: /proc·/sys 를 hostPath로 읽어야 한다
#   OTel Agent   : /var/log 를 hostPath로 읽어야 한다
#   hostPath는 baseline에서도 금지이므로 privileged 외에 선택지가 없다.
#
# audit는 baseline으로 남겨둔다 → 이 예외를 실제로 누가 쓰는지 감사 로그에 기록된다.
# warn은 privileged로 맞춘다   → 어차피 위반이 예정된 곳이라 콘솔 경고가 계속 뜨면
#                               경고 자체를 무시하게 된다(alarm fatigue).
apiVersion: v1
kind: Namespace
metadata:
  name: dang-obsv-agent-ns
  labels:
    tier: observability
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/warn-version: v1.36

---
# ── Vault ─────────────────────────────────────────────────────
# Q1 NO / Q2 NO → restricted
# ⚠️ 단 조건이 하나 있다: Vault는 메모리 스왑을 막으려고 IPC_LOCK capability(mlock)를
#    요구하는데, restricted는 capabilities.drop:[ALL]을 요구해서 충돌한다.
#    → Vault 설정에 `disable_mlock: true`를 넣으면 해결된다.
#      쿠버네티스 노드는 원래 swap을 끄는 것이 전제라 mlock의 실익이 크지 않다.
#    → 만약 mlock을 켜야 한다면 이 네임스페이스만 baseline으로 내린다.
apiVersion: v1
kind: Namespace
metadata:
  name: dang-vault-ns
  labels:
    tier: security
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36

---
# ── cert-manager ──────────────────────────────────────────────
# Q1 NO / Q2 NO → restricted (controller·webhook·cainjector 모두 non-root 기본)
apiVersion: v1
kind: Namespace
metadata:
  name: dang-cert-manager-ns
  labels:
    tier: security
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36

---
# ── Kyverno ───────────────────────────────────────────────────
# Q1 NO / Q2 NO → restricted (admission·background·cleanup·reports 모두 non-root)
apiVersion: v1
kind: Namespace
metadata:
  name: dang-kyverno-ns
  labels:
    tier: security
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36

---
# ── Istio ─────────────────────────────────────────────────────
# Q1 host 접근? YES → privileged
#   istio-cni 노드 에이전트가 DaemonSet으로 각 노드의 CNI 설정을 건드린다.
#   Gateway 자체는 non-root지만, 같은 네임스페이스에 노드 에이전트가 있으므로
#   네임스페이스 레벨은 privileged가 되어야 한다.
#   (Istio 공식도 istio-system에 privileged를 요구한다)
apiVersion: v1
kind: Namespace
metadata:
  name: dang-istio-system
  labels:
    tier: network
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/warn-version: v1.36

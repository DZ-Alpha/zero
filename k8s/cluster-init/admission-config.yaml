# PSA(Pod Security Admission) 클러스터 기본값
#
# 왜 필요한가:
#   네임스페이스에 PSA 라벨을 안 붙이면 그 네임스페이스는 "privileged"와 동일하게
#   아무 검사 없이 통과한다. 라벨을 붙이는 걸 깜빡하면 그게 곧 무방비 구간이 된다.
#   이 파일은 "라벨이 없을 때 적용될 기본값"을 클러스터 차원에서 정해서,
#   실수 경로 자체를 없앤다.
#
# 적용 위치: kube-apiserver --admission-control-config-file
# 배치 경로: /etc/kubernetes/admission/admission-config.yaml
# ⚠️ kubeadm init 이후에 넣으면 API 서버 재시작이 필요하다. 지금 넣는 게 가장 싸다.

apiVersion: apiserver.config.k8s.io/v1
kind: AdmissionConfiguration
plugins:
  - name: PodSecurity
    configuration:
      apiVersion: pod-security.admission.config.k8s.io/v1
      kind: PodSecurityConfiguration

      # 네임스페이스에 라벨이 없을 때 적용되는 값
      defaults:
        # enforce = 실제로 막는 수준.
        # baseline으로 두는 이유: restricted를 클러스터 기본으로 깔면
        #   CNI·kube-proxy 등 시스템 컴포넌트와 일반 워크로드가 광범위하게 거부된다.
        #   여기서의 목적은 "주 통제"가 아니라 "라벨 누락 시의 안전망"이다.
        #   주 통제는 각 네임스페이스에 restricted 라벨을 명시적으로 붙여서 한다.
        enforce: "baseline"

        # ⬅ 결정 필요: 클러스터 K8s 마이너 버전을 적는다 (예: "v1.35")
        #    "latest"로 두면 클러스터를 업그레이드할 때 정책 판정이 조용히 바뀔 수 있다.
        #    버전을 고정하면 업그레이드가 정책을 건드리지 않는다.
        enforce-version: "v1.36"

        # audit/warn은 restricted로 한 단계 높게 둔다.
        # 막지는 않지만, "restricted였다면 걸렸을 것"이 로그와 경고로 계속 보인다.
        # 즉 지금 상태에서 restricted로 올릴 때 뭐가 깨질지 미리 알 수 있다.
        audit: "restricted"
        audit-version: "v1.36"
        warn: "restricted"
        warn-version: "v1.36"

      exemptions:
        # 이 네임스페이스들은 검사 자체를 면제한다.
        # kube-system은 필수 — CNI·kube-proxy·etcd 등이 privileged 권한을 실제로 필요로 한다.
        # 면제하지 않으면 클러스터가 기동되지 않는다.
        namespaces:
          - kube-system

        # 특정 사용자/런타임클래스 면제는 쓰지 않는다.
        # 면제 대상이 늘수록 정책의 의미가 줄어들기 때문에 최소로 유지한다.
        usernames: []
        runtimeClasses: []

# 감사 로그(Audit) 정책
#
# 왜 필요한가:
#   "누가 언제 무엇을 했는가"를 남기는 유일한 수단이다.
#   사고가 났을 때 원인과 영향 범위를 확인할 근거가 여기밖에 없다.
#
# 설계 원칙 두 가지:
#   1) 무조건 상세하게 남기지 않는다. level을 높이면 Secret 본문까지 로그에 남는다.
#      감사 로그 자체가 유출 대상이 된다.
#   2) 규칙은 위에서부터 순서대로 검사하고 "처음 맞는 것"이 적용된다.
#      그래서 노이즈 제거 규칙을 위에, 포괄 규칙을 아래에 둔다.
#
# level 4단계: None(기록 안 함) < Metadata(누가·무엇을·언제) < Request(요청 본문 포함)
#              < RequestResponse(응답까지)
#
# 적용 위치: kube-apiserver --audit-policy-file
# 배치 경로: /etc/kubernetes/audit/audit-policy.yaml

apiVersion: audit.k8s.io/v1
kind: Policy

# 요청이 "도착한 시점"은 기록하지 않는다. 결과가 나온 시점만 남기면 충분하고,
# 이걸 켜두면 로그가 두 배가 된다.
omitStages:
  - RequestReceived

rules:
  # ── 1. 노이즈 제거 ──────────────────────────────────────────
  # 시스템 컴포넌트의 반복 조회는 양이 압도적인데 조사 가치가 없다.

  - level: None
    users: ["system:kube-proxy"]
    verbs: ["watch"]

  - level: None
    userGroups: ["system:nodes"]
    verbs: ["get"]

  - level: None
    nonResourceURLs:
      - "/healthz*"
      - "/readyz*"
      - "/livez*"
      - "/metrics"
      - "/version"

  # ── 2. Secret·ConfigMap은 반드시 Metadata까지만 ─────────────
  # ⚠️ 여기를 Request 이상으로 올리면 비밀번호·토큰 본문이 로그 파일에 평문으로 남는다.
  #    감사 로그를 읽을 수 있는 사람 = 모든 Secret을 읽을 수 있는 사람이 된다.
  #    이 규칙을 아래쪽 포괄 규칙보다 반드시 위에 둬야 한다.
  - level: Metadata
    resources:
      - group: ""
        resources: ["secrets", "configmaps"]

  # ── 3. 권한 변경은 본문까지 ──────────────────────────────────
  # 누가 누구에게 무슨 권한을 줬는지가 침해 조사의 핵심이다.
  # 권한이 조용히 넓어지는 것을 잡으려면 "무엇을 줬는지"까지 필요하다.
  - level: Request
    resources:
      - group: "rbac.authorization.k8s.io"
        resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]

  # ── 4. 파드 내부 접근은 본문까지 ─────────────────────────────
  # exec / attach / port-forward는 "컨테이너 안에 들어간 행위"다.
  # 정상 운영에서도 쓰지만, 침해 시에도 가장 먼저 쓰이는 경로다.
  - level: Request
    resources:
      - group: ""
        resources: ["pods/exec", "pods/attach", "pods/portforward"]

  # ── 5. 나머지 "쓰기"는 전부 Metadata ────────────────────────
  # 무엇이 언제 만들어지고 지워졌는지는 남긴다. 본문은 남기지 않는다.
  - level: Metadata
    verbs: ["create", "update", "patch", "delete", "deletecollection"]

  # ── 6. 그 외(읽기)는 기록하지 않는다 ────────────────────────
  # ⬅ 결정 지점: 여기를 Metadata로 올리면 "누가 무엇을 조회했는지"까지 남지만
  #    로그 양이 크게 늘어난다. 마스터 1대 구성이라 디스크 여유를 고려해 None으로 시작한다.
  #    조회 이력이 필요해지면 이 줄만 Metadata로 바꾸면 된다.
  - level: None

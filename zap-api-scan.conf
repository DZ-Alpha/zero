# ZAP api-scan 규칙 정책 (zap-api-scan.py -c 로 전달)
# 형식: <rule_id>\t<WARN|FAIL|IGNORE>\t(설명)   ※ 필드 구분은 TAB
#
# 배경: zap-api-scan은 기본적으로 "모든 알림을 WARN으로 취급"한다(공식 문서).
# 그래서 SQL Injection을 High로 탐지해도 WARN이라 -I 옵션으로 통과돼 버린다.
# 실제 공격 가능한 "주입 계열"만 FAIL로 승격해 prod 승격을 차단한다.
# 나머지(보안 헤더 등 Medium 이하)는 여기 명시하지 않으므로 기본 WARN 유지 →
# 오탐으로 무관한 서비스 배포가 막히지 않는다.

# gitleaks 커스텀 규칙
#
# 왜 필요한가:
#   기본 규칙은 AWS 키·GitHub 토큰처럼 "고엔트로피 문자열"을 잡도록 설계돼 있다.
#   사람이 읽을 수 있는 비밀번호(예: 팀 규칙 비밀번호)는 엔트로피가 낮아 통과한다.
#   실제로 2026-07-13에 이 훅이 켜져 있는 상태에서 VM 계정 비밀번호가 커밋됐고,
#   공개 저장소 main 에 15일간 노출됐다. 기본 규칙만으로는 못 막는다는 게 실증됐다.
#
# 방침:
#   - 기본 규칙은 그대로 상속하고(extend), 우리 환경에 특화된 규칙만 추가한다
#   - 오탐이 잦으면 훅을 꺼버리게 되므로, "확실한 것"만 잡는다
#   - 값 자체를 이 파일에 적지 않는다. 이 파일도 git 추적 대상이다

title = "ZeroCheck gitleaks config"

[extend]
useDefault = true

# ⚠️ gitleaks 는 Go 의 RE2 엔진을 쓴다. 전방탐색((?!...))·후방탐색·역참조를 지원하지 않는다.
#    "이건 제외" 는 정규식이 아니라 아래 [allowlist] 로 처리해야 한다.
#    (2026-07-28 최초 작성 시 (?!...) 를 넣었다가 규칙이 컴파일 안 되는 것을 확인하고 수정함)

# ── 1. 팀 비밀번호 규칙 패턴 ────────────────────────────────────
# 팀 비밀번호는 "<단어>pass#" / "<단어>pass#<숫자>" 형태를 쓴다 (07/29 로테이션 후 현행).
# 값을 직접 적지 않고 형태만 매칭한다. (?i)라 구 계열·대문자 변형도 같이 잡힌다.
# ⚠️ 2026-07-29 결함 수정: 종전 정규식은 "<word>zero#" 꼴을 찾았는데, 실제 구·신
#    비밀번호 어느 쪽도 그 형태가 아니어서 한 번도 매칭될 수 없었다(비밀번호 유출을
#    훅이 못 잡은 원인 중 하나). 형태 규칙은 반드시 실제 값과 대조 검증할 것.
# 끝에 \b 를 두면 # 뒤가 비단어 문자일 때 경계가 성립하지 않아 놓친다. 그래서 끝 \b 를 뺐다.
[[rules]]
id = "zerocheck-team-password"
description = "팀 비밀번호 규칙(<word>pass#...) 형태의 평문 비밀번호"
regex = '''(?i)\b[a-z]{3,12}pass#[0-9]{0,4}'''
tags = ["password", "zerocheck"]

# ── 2. 비밀번호 대입 구문 ───────────────────────────────────────
# password/passwd/pwd 뒤에 값이 오는 경우를 넓게 잡고,
# 플레이스홀더·환경변수 참조는 [allowlist] 에서 걸러낸다.
[[rules]]
id = "generic-password-assignment"
description = "비밀번호에 실제 값이 대입된 구문"
regex = '''(?i)\b(password|passwd|pwd)\s*[:=]\s*['"]?[^\s'"`,;{}<>$]{6,}'''
tags = ["password"]

# ── 3. sshpass 인라인 비밀번호 ──────────────────────────────────
# sshpass -p '<값>' 형태. CI 스크립트에서 실제로 쓰였던 패턴이다.
# 문자 클래스에서 $ 를 빼서 sshpass -p "$VAR" 같은 변수 참조는 안 걸리게 했다.
[[rules]]
id = "sshpass-inline"
description = "sshpass -p 에 비밀번호가 인라인으로 들어간 경우"
regex = '''sshpass\s+-p\s+['"]?[^\s'"$]{4,}'''
tags = ["password", "ssh"]

# ── 4. Proxmox API 토큰 ────────────────────────────────────────
# root 권한을 상속하는 토큰이라 유출 시 VM 전체 조작이 가능하다.
[[rules]]
id = "proxmox-api-token"
description = "Proxmox API 토큰"
regex = '''PVEAPIToken\s*=\s*\S+'''
tags = ["token", "proxmox"]

# ── 5. Slack Webhook ───────────────────────────────────────────
[[rules]]
id = "slack-webhook-url"
description = "Slack Incoming Webhook URL"
regex = '''https://hooks\.slack\.com/services/[A-Za-z0-9/+]{20,}'''
tags = ["webhook", "slack"]

# ── 6b. AWS secret access key (문맥 기반) ──────────────────────
# 기본 규칙은 AKIA... (key ID)만 잡고 짝인 40자 secret 은 놓쳤다 (07/29 시방서 CSV 실측).
# secret_access_key 라는 문맥 단어 옆의 40자 내외 값을 잡는다 (CSV·yaml·env 모두 커버).
[[rules]]
id = "aws-secret-access-key-context"
description = "AWS secret access key (secret_access_key 문맥 옆의 실값)"
regex = '''(?i)secret_access_key[",'=:\s]+[A-Za-z0-9/+]{30,}'''
tags = ["aws", "secret"]

# ── 6. Harbor robot 계정 토큰 ──────────────────────────────────
# robot$... 계정명 옆에 토큰이 함께 적히는 경우가 있었다.
[[rules]]
id = "harbor-robot-token"
description = "Harbor robot 계정 토큰"
regex = '''(?i)harbor[_-]?robot[_-]?token\s*[:=]\s*['"]?[A-Za-z0-9]{16,}'''
tags = ["token", "harbor"]

# ── 예외 ───────────────────────────────────────────────────────
[allowlist]
description = "오탐 제외"
# regexes 를 "매칭된 비밀 문자열"이 아니라 "줄 전체"와 대조한다.
# 기본값(secret 대상)이면 password=quote_plus(...) 같은 관용구 제외가 동작하지 않음 (07/29 실측)
regexTarget = "line"

paths = [
  # 로컬 전용 자격증명 파일(gitignore 되어 있지만 이중 안전장치)
  '''.*\.credentials\.local\.md$''',
  # 학습 자료 — 개념 설명에 예시 값이 나온다
  '''docs/k8s-study/.*''',
  # 병렬 세션용 worktree(중복 사본)
  '''zero-worktrees/.*''',
  # 이 설정 파일 자체
  '''\.gitleaks\.toml$''',
]

regexes = [
  # 플레이스홀더는 비밀이 아니다
  '''REPLACE_ME''',
  '''CHANGEME''',
  '''CHANGE_ME''',
  # 환경변수 참조는 값이 아니다
  '''\$\{[A-Z_]+\}''',
  '''\$\([A-Za-z_]+\)''',
  # GitHub Actions secrets 참조
  '''secrets\.[A-Z_]+''',
  # ── 코드 관용구 (2026-07-29 오탐 20건 전수 분류 후 추가) ──
  # password=변수.속성 / password=함수(...) — 값이 아니라 참조다
  '''(?i)\b(password|passwd|pwd)\s*[:=]\s*[a-zA-Z_][A-Za-z0-9_]*\.[A-Za-z_]''',
  '''(?i)\b(password|passwd|pwd)\s*[:=]\s*[a-zA-Z_][A-Za-z0-9_.]*\(''',
  # curl -u "$VAR:" — 환경변수 참조 (기본 규칙 curl-auth-user 오탐)
  '''-u\s+['"]?\$''',
  # password=DB_PASSWORD 처럼 대문자 상수 참조는 값이 아니다 (kafka 스크립트 오탐 4건)
  '''(?i)\b(password|passwd|pwd)\s*[:=]\s*[A-Z][A-Z_]{2,}\b''',
  # 프론트 localStorage 키 이름 (dangdang-...-v1 꼴 문자열은 저장소 키지 비밀이 아님)
  '''dangdang-[a-z-]+-v?[0-9]*''',
]

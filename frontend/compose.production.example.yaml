services:
  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE to the Harbor image and immutable tag}
    container_name: dangdang-frontend
    restart: unless-stopped
    environment:
      BACKEND_GATEWAY_URL: ${BACKEND_GATEWAY_URL:-http://b-gateway:8080}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?Set PUBLIC_APP_URL to the public HTTPS origin}
      # backend-deploy-production/frontend-deploy-production처럼 GitHub Secrets로
      # 넘겨받는 경로가 없어서(2026-07-26 실측 - :?로 두면 배포/롤백 둘 다
      # interpolation 단계에서 즉시 실패), diet-service의 MINIO_ENDPOINT 기본값과
      # 맞춰 기본값을 직접 박아둔다. 서버마다 다르면 .env로 덮어쓸 것.
      MINIO_URL: ${MINIO_URL:-http://10.10.20.10:9000}
    expose:
      - "3000"
    volumes:
      - frontend-uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 150
    networks:
      - dangdang-edge

volumes:
  frontend-uploads:

networks:
  dangdang-edge:
    external: true
    name: ${APP_NETWORK:-dangdang-edge}
